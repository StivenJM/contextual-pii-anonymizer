[project]
name = "e2e"
version = "0.1.0"
description = "Integration tests for the browser extension and the privacy middleware"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "playwright>=1.55",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "--strict-markers"]
markers = [
    "integration: tests that require the Docker test stack",
]
