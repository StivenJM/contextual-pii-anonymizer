[project]
name = "api"
version = "0.1.0"
description = "FastAPI service for the contextual PII anonymizer"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi[standard]>=0.139.0",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.0,<4.0",
    "pydantic-settings>=2.0,<3.0",
    "sqlalchemy>=2.0,<3.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.fastapi]
entrypoint = "app.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
