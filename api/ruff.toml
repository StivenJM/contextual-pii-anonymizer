target-version = "py314"
line-length = 88

extend-exclude = [
    "alembic/versions",
]

[lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "FAST",
    "ASYNC",
    "SIM",
    "C4",
    "PIE",
    "RET",
    "RUF",
    "PT",
]

[format]
quote-style = "double"
indent-style = "space"
