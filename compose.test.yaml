name: contextual-pii-anonymizer-e2e

services:

  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: contextual_pii
      POSTGRES_USER: contextual_pii
      POSTGRES_PASSWORD: e2e-local-password
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  inference:
    build:
      context: ./e2e
      dockerfile: docker/inference-stub.Dockerfile
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/readyz', timeout=2)"
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  converter:
    build:
      context: ./browser-extension/backend
    environment:
      SECRET_TOKEN: ${E2E_MIDDLEWARE_TOKEN:-e2e-middleware-token}
    ports:
      - "127.0.0.1:${CONVERTER_PORT:-5000}:5000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/docs', timeout=2)"
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ./api
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: contextual_pii
      POSTGRES_USER: contextual_pii
      POSTGRES_PASSWORD: e2e-local-password
      BENTOML_URL: http://inference:3000
      BENTOML_TIMEOUT_SECONDS: "30"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      inference:
        condition: service_healthy
    command: >
      sh -c "
        uv run --frozen alembic upgrade head &&
        uv run --frozen uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"
        ]
      interval: 2s
      timeout: 5s
      retries: 60
